<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#17120e"/>
  <radialGradient id="warm" cx="20%" cy="0%" r="70%"><stop offset="0" stop-color="#a86a3c" stop-opacity=".16"/><stop offset="1" stop-color="#a86a3c" stop-opacity="0"/></radialGradient>
  <rect width="1600" height="900" fill="url(#warm)"/>
  <text x="80" y="72" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#b67a4b" text-anchor="start" font-weight="400" letter-spacing="1.6">MOTION BREAKDOWN · 06 / 07</text>
  <text x="80" y="130" font-family="Cormorant, 'Cormorant Garamond', Georgia, serif" font-size="56" fill="#f8f4ec" text-anchor="start" font-weight="400" letter-spacing="0">Loader — once per visit, never in the way</text>
  <text x="80" y="168" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#8f867e" text-anchor="start" font-weight="400" letter-spacing="0">“Preparing your coffee…” shows on a first desktop visit only. It stays at least 800ms, never more than 2.2s, then the hero entrance begins.</text>
  
      <line x1="300" x2="300" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="300" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">0S</text><line x1="400" x2="400" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="400" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">0.25S</text><line x1="500" x2="500" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="500" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">0.5S</text><line x1="600" x2="600" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="600" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">0.75S</text><line x1="700" x2="700" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="700" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">1S</text><line x1="800" x2="800" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="800" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">1.25S</text><line x1="900" x2="900" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="900" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">1.5S</text><line x1="1000" x2="1000" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="1000" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">1.75S</text><line x1="1100" x2="1100" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="1100" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">2S</text><line x1="1200" x2="1200" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="1200" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">2.25S</text><line x1="1300" x2="1300" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="1300" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">2.5S</text><line x1="1400" x2="1400" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="1400" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">2.75S</text><line x1="1500" x2="1500" y1="250" y2="518" stroke="#35302b" stroke-width="1"/><text x="1500" y="540" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="middle" font-weight="400" letter-spacing="1.6">3S</text><text x="80" y="290" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#f8f4ec" text-anchor="start" font-weight="400" letter-spacing="0">Boot script (in &lt;head>)</text><text x="80" y="312" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="start" font-weight="400" letter-spacing="1.6">DECIDES BEFORE FIRST PAINT</text>
        <rect x="300" y="268" width="20" height="34" rx="8" fill="#a86a3c" fill-opacity="0.9"/>
        <text x="332" y="290" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#efe5d7" text-anchor="start" font-weight="400" letter-spacing="1.6">SESSIONSTORAGE · PHONE · REDUCED MOTION → SKIP</text><text x="80" y="354" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#f8f4ec" text-anchor="start" font-weight="400" letter-spacing="0">Loader visible</text><text x="80" y="376" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="start" font-weight="400" letter-spacing="1.6">PERCENT FOLLOWS REAL PROGRESS</text>
        <rect x="300" y="332" width="640" height="34" rx="8" fill="#a86a3c" fill-opacity="0.9"/><path d="M300 362 C440.8 362 530.4 336 940 336" fill="none" stroke="#f8f4ec" stroke-opacity=".55" stroke-width="1.5"/>
        <text x="952" y="354" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#efe5d7" text-anchor="start" font-weight="400" letter-spacing="1.6">MIN 800MS · MAX 2200MS</text><text x="80" y="418" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#f8f4ec" text-anchor="start" font-weight="400" letter-spacing="0">Finish condition</text><text x="80" y="440" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="start" font-weight="400" letter-spacing="1.6">PROGRESS ≥ 85% AND ≥ 800MS</text>
        <rect x="620" y="396" width="560" height="34" rx="8" fill="#a86a3c" fill-opacity="0.35"/>
        <text x="1192" y="418" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#efe5d7" text-anchor="start" font-weight="400" letter-spacing="1.6">WHICHEVER COMES FIRST</text><text x="80" y="482" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#f8f4ec" text-anchor="start" font-weight="400" letter-spacing="0">Hero entrance</text><text x="80" y="504" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="start" font-weight="400" letter-spacing="1.6">NOIR-INTRO-LATE SHIFTS THE DELAYS</text>
        <rect x="940" y="460" width="440" height="34" rx="8" fill="#a86a3c" fill-opacity="0.9"/><path d="M940 490 C1036.8 490 1098.4 464 1380 464" fill="none" stroke="#f8f4ec" stroke-opacity=".55" stroke-width="1.5"/>
        <text x="1392" y="482" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#efe5d7" text-anchor="start" font-weight="400" letter-spacing="1.6">THEN HERO_DELAYS</text>
      <text x="80" y="650" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#f8f4ec" text-anchor="start" font-weight="600" letter-spacing="0">Skipped entirely</text>
      <text x="80" y="684" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#efe5d7" text-anchor="start" font-weight="400" letter-spacing="1.6">REPEAT VISITS IN THE SESSION · PHONES BELOW 768PX · PREFERS-REDUCED-MOTION</text>
      <text x="80" y="740" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#f8f4ec" text-anchor="start" font-weight="600" letter-spacing="0">Why it's cheap</text>
      <text x="80" y="774" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#efe5d7" text-anchor="start" font-weight="400" letter-spacing="1.6">THE BOOT RUNS BEFORE REACT; THE HEADLINE IS ALREADY IN THE HTML BEHIND THE VEIL</text>
    
  <text x="80" y="856" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="13" fill="#8f867e" text-anchor="start" font-weight="400" letter-spacing="1.6">SOURCE · COMPONENTS/LAYOUT/LOADER.TSX (LOADER_BOOT) · COMPONENTS/LAYOUT/LOADERCONTROLLER.TSX</text>
