start" font-weight="400" letter-spacing="1.6">RUNS</text><text x="1150" y="516" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#efe5d7" text-anchor="start" font-weight="400" letter-spacing="0">only while visible · after load + idle</text><text x="970" y="558" font-family="Plex, 'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#8f867e" text-anchor="start" font-weight="400" letter-spacing="1.6">READS</text><text x="1150" y="558" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#efe5d7" text-anchor="start" font-weight="400" letter-spacing="0">scroll from events — never layout per frame</text>
