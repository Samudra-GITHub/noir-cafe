<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t">
  <title id="t">Every day, in every cup. Made with care by Samudra Kar.</title>
  <defs>
    <filter id="stain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="14"/>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="28" fill="#17120e"/>
  <!-- Coffee stain rings -->
  <g filter="url(#stain)" fill="none">
    <circle cx="1060" cy="170" r="92" stroke="#a86a3c" stroke-width="7" opacity="0.28"/>
    <circle cx="1060" cy="170" r="84" stroke="#3c2415" stroke-width="3" opacity="0.6"/>
    <circle cx="1108" cy="214" r="54" stroke="#a86a3c" stroke-width="4" opacity="0.18"/>
  </g>
  <g font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" fill="#f8f4ec">
    <text x="96" y="150" font-size="52">Coffee, composed with care.</text>
    <text x="96" y="210" font-size="52" font-style="italic" fill="#efe5d7">Every day, in every cup.</text>
  </g>
  <!-- Signature line draws itself -->
  <path d="M96 268c40-18 70 10 110-4s50-22 84-6 60 8 90-4" fill="none" stroke="#a86a3c" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="420" stroke-dashoffset="420">
    <animate attributeName="stroke-dashoffset" values="420;0;0;420" keyTimes="0;0.4;0.85;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5">
    <text x="96" y="310" fill="#8f867e">MADE WITH CARE BY</text>
    <text x="252" y="310" fill="#b67a4b">SAMUDRA KAR</text>
    <text x="1184" y="310" text-anchor="end" fill="#6d645b">© 2026 NOIR CAFÉ</text>
  </g>
</svg>
