<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t">
  <title id="t">Motion timeline — loader, hero, scroll story, sections, transitions</title>
  <rect width="1280" height="520" rx="28" fill="#17120e"/>
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" letter-spacing="1.3">
    <text x="64" y="72" font-size="12" fill="#b67a4b">THE MOTION LANGUAGE · ONE CURVE · CUBIC-BEZIER(0.22, 1, 0.36, 1)</text>
    <line x1="64" y1="260" x2="1216" y2="260" stroke="#35302b" stroke-width="2"/>
    <line x1="64" y1="260" x2="1216" y2="260" stroke="#a86a3c" stroke-width="2" stroke-dasharray="1152" stroke-dashoffset="1152">
      <animate attributeName="stroke-dashoffset" values="1152;0;0" keyTimes="0;0.7;1" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8f867e" letter-spacing="1">
    <g transform="translate(64 0)">
      <circle cy="260" r="7" fill="#a86a3c"/>
      <text y="210" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#f8f4ec" letter-spacing="0">Loader</text>
      <text y="232">0 → 0.8–2.2S</text>
      <text y="300">CUP FILLS · STEAM</text><text y="318">REAL READINESS BAR</text><text y="336">ONCE PER SESSION</text>
    </g>
    <g transform="translate(300 0)">
      <circle cy="260" r="7" fill="#a86a3c"/>
      <text y="210" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#f8f4ec" letter-spacing="0">Hero</text>
      <text y="232">STAGGER .1 → 1.1S</text>
      <text y="300">MASKED LINE REVEAL</text><text y="318">PARALLAX −64PX</text><text y="336">GRAIN · VIGNETTE · STEAM</text>
    </g>
    <g transform="translate(536 0)">
      <circle cy="260" r="7" fill="#a86a3c"/>
      <text y="210" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#f8f4ec" letter-spacing="0">Scroll story</text>
      <text y="232">PINNED · 5 CHAPTERS</text>
      <text y="300">FILMS CROSSFADE</text><text y="318">ONE FILM PLAYS</text><text y="336">CARAMEL TIMELINE</text>
    </g>
    <g transform="translate(772 0)">
      <circle cy="260" r="7" fill="#a86a3c"/>
      <text y="210" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#f8f4ec" letter-spacing="0">Sections</text>
      <text y="232">FADE-UP .7S · STAGGER .12</text>
      <text y="300">IMAGE ZOOM 1 → 1.08</text><text y="318">CLIP-PATH REVEALS</text><text y="336">HOVER LIFT −8PX</text>
    </g>
    <g transform="translate(1008 0)">
      <circle cy="260" r="7" fill="#a86a3c"/>
      <text y="210" font-family="'Cormorant Garamond', Georgia, serif" font-size="30" fill="#f8f4ec" letter-spacing="0">Transitions</text>
      <text y="232">320 / 560MS</text>
      <text y="300">BLUR + GRAIN DISSOLVE</text><text y="318">SHARED GLASS NAV</text><text y="336">SLIDING ACTIVE RULE</text>
    </g>
  </g>
  <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6d645b" letter-spacing="1">
    <line x1="64" y1="420" x2="1216" y2="420" stroke="#35302b"/>
    <text x="64" y="456">EVERY ANIMATION RESPECTS PREFERS-REDUCED-MOTION · TRANSFORM + OPACITY ONLY · NOTHING DELAYS CONTENT</text>
  </g>
